services:
  postgres-turismo:
    image: postgres:16-alpine
    container_name: turismoia_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: turismoia
    ports:
      - "5434:5432"
    volumes:
      - pgdata_turismo:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata_turismo:
    driver: local
